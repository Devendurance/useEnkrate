[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../lib"]
remappings = ["@openzeppelin/contracts/=../lib/openzeppelin-contracts/contracts/"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
multiline_func_header = "all"